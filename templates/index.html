<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Loja Exercício</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
</head>
<body>
    <h1>Cadastro da Loja</h1>

    <h3>Nova Categoria</h3>
    <form action="/categoria/nova" method="post">
        <input type="text" name="nome" placeholder="Nome da Categoria" required>
        <button type="submit">Salvar</button>
    </form>

    <hr>

    <h3>Novo Produto</h3>
    <form action="/produto/novo" method="post">
        <input type="text" name="nome" placeholder="Nome do Produto" required>
        <input type="number" step="0.01" name="preco" placeholder="Preço" required>
        <input type="number" name="estoque" placeholder="Estoque" required>
        
        <select name="categoria_id">
            {% for cat in categorias %}
                <option value="{{ cat.id }}">{{ cat.nome }}</option>
            {% endfor %}
        </select>
        <button type="submit">Salvar Produto</button>
    </form>

    <h2>Produtos Cadastrados</h2>
    <ul>
        {% for prod in produtos %}
            <li>{{ prod.nome }} - R$ {{ prod.preco }} (Categoria: {{ prod.categoria.nome }})</li>
        {% endfor %}
    </ul>
</body>
</html>
